        function getAvailableWindowWidth() {
            if(window.innerWidth) {
                return window.innerWidth;
            } else if(document.documentElement.clientWidth) {
                return document.documentElement.clientWidth;
            } else if(document.body.clientWidth) {
                return document.body.clientWidth;
            }
            return 0;
        }

        function resizeEventHandler() {
            $('iframe').width(getAvailableWindowWidth()-50);
            resizeVideoFrame();
        }

        // 動画が埋め込まれている場合は、再生枠を自動調整する
        function resizeVideoFrame() {
            var height = $('body:first').height();
            if(window.innerHeight && height < window.innerHeight) {
                height = window.innerHeight;
            } else if(document.body.clientHeight && height < document.body.clientHeight) {
                height = document.body.clientHeight;
            }
            var width = document.documentElement.clientWidth;
            var aspect;
            var max_aspect = 3.0 / 4.0;
            var min_aspect = 9.0 / 16.0;
            var rate = 0.85;
            if (width * max_aspect > height) {
                aspect = height/width; //3.0/4.0;
                if( aspect > max_aspect) {
                    // 縦長すぎるときは 3/4 に
                    aspect = max_aspect;
                } else if( aspect < min_aspect) {
                    // 横長すぎるときは 9/16 に
                    aspect = min_aspect;
                }
                if(height / aspect > 640) {
                    height = 640*aspect;
                }
                $("video.attachedPlayer").attr("width", height / aspect * rate).attr("height", height * rate);
                $("object.attachedPlayer").attr("width", height / aspect * rate).attr("height", height * rate);
                $("object.attachedPlayer embed").attr("width", height / aspect * rate).attr("height", height * rate);
            } else {
                // スクリーンが縦長の時は 3:4 を維持
                aspect = max_aspect;
                if(width > 640) {
                    width = 640;
                }
                $("video.attachedPlayer").attr("width", width * rate).attr("height", width * aspect * rate);
                $("object.attachedPlayer").attr("width", width * rate).attr("height", width * aspect * rate);
                $("object.attachedPlayer embed").attr("width", width * rate).attr("height", width * aspect * rate);
            }
        }
    </script>
