  </div>
          <div class="col-sm-10">

              <form method="POST" action="" id="message-form">

<div class="sm-bars">
  <div class="sm-pager-bar">          <button class="btn btn-default btn-sm" disabled>最初</button>
      <button class="btn btn-default btn-sm" disabled>‹ 前へ</button>
        <span class="page-current"><strong>1</strong> / 1</span>
          <button class="btn btn-default btn-sm" disabled>次へ ›</button>
      <button class="btn btn-default btn-sm" disabled>最後</button>
    </div>
  <div class="sm-action-bar">
    <label class="sm-selall"><input type="checkbox" aria-label="すべて選択"
      onclick="document.querySelectorAll('.sm-msg input[name=\'id[]\']').forEach(function(c){c.checked = event.target.checked;})"></label>
    <button type="submit" name="RESET_UNREADFLAG" value="1" class="btn btn-default btn-sm">未読に戻す</button>
    <button type="submit" name="UNSET_UNREADFLAG" value="1" class="btn btn-default btn-sm">既読にする</button>
    <button type="submit" name="downloadmsg" value="1" class="btn btn-default btn-sm"
            formaction="/webclass/messages.php/course/00x_000001/export?acs_=00000000" formtarget="_blank">ダウンロード</button>
    <button type="submit" name="COMFIRM_SELECTED" value="1" class="btn btn-default btn-sm">削除</button>
  </div>
</div>

<div class="toolbar clearfix pc-toolbar">
  <button type="submit" name="COMFIRM_SELECTED" value="1" class="btn btn-default btn-sm">削除</button>
  <button type="submit" name="RESET_UNREADFLAG" value="1" class="btn btn-default btn-sm">未読に戻す</button>
  <button type="submit" name="UNSET_UNREADFLAG" value="1" class="btn btn-default btn-sm">既読にする</button>
  <button type="submit" name="downloadmsg" value="1" class="btn btn-default btn-sm"
          formaction="/webclass/messages.php/course/00x_000001/export?acs_=00000000" formtarget="_blank">ダウンロード</button>

  <span class="pull-right">          <button class="btn btn-default btn-sm" disabled>最初</button>
      <button class="btn btn-default btn-sm" disabled>‹ 前へ</button>
        <span class="page-current"><strong>1</strong> / 1</span>
          <button class="btn btn-default btn-sm" disabled>次へ ›</button>
      <button class="btn btn-default btn-sm" disabled>最後</button>
    </span>
</div>

  <div class="empty">受信メッセージはありません</div>
</form>

          </div>
        </div>
    </div>

    <!-- スマホ用 上から drawer -->
    <div class="drawer-overlay" id="drawer-overlay"></div>
    <div class="top-drawer" id="top-drawer">
        <div class="drawer-head">
            <span class="drawer-title">メニュー</span>
            <button class="drawer-close" id="drawer-close" type="button" aria-label="閉じる">×</button>
        </div>
        <div class="drawer-body">
            <div class="col-sm-2 side-nav" id="side-nav">
  <h5>メッセージ</h5>

          <li class=""><a href="/webclass/messages.php/course/00x_000001/compose">メッセージ作成</a></li>
          </ul>

    <h5>お知らせ</h5>
  <ul class="nav nav-pills nav-stacked">
    <li><a href="/webclass/information.php/course/00x_000001/">一覧</a></li>
          </ul>
  </div>
        </div>
    </div>

    <div class="tt-overlay" id="tt-overlay">
  <div class="tt-modal">
    <div class="tt-head clearfix">
      <h4>コース選択</h4>
      <button class="tt-close" id="tt-close" type="button">×</button>
    </div>
    <form method="get" action="/webclass/messages.php/course/00x_000001/inbox" class="tt-toolbar clearfix" id="tt-toolbar-form">
      <select class="tt-select" name="ttyear" aria-label="年度">
        <option value="all" >All</option>
                  <option value="2027" >2027 年度</option>
                  <option value="2026" selected>2026 年度</option>
                  <option value="2025" >2025 年度</option>
                  <option value="2024" >2024 年度</option>
                  <option value="2023" >2023 年度</option>
                  <option value="2022" >2022 年度</option>
                  <option value="2021" >2021 年度</option>
                  <option value="2020" >2020 年度</option>
              </select>
      <select class="tt-select" name="ttsemester" aria-label="学期">
        <option value="all" >All</option>
                  <option value="0" >通年</option>
                  <option value="1" >前期</option>
                  <option value="2" selected>後期</option>
              </select>
      <input type="text" class="tt-search" id="tt-search" placeholder="検索" autocomplete="off">
    </form>
    <div class="tt-body">
                      <ul class="course-list tt-schedule">
                      <li class="course-list-section-head tt-day-head">月曜日</li>
                                          <li class="course-list-section-head tt-period-head">5限</li>
                            <li class="course-list-item"><a href="/webclass/messages.php/course/00x_000001/inbox" data-course="00x_000001" data-name="00x_サンプル科目A">&raquo; 00x_サンプル科目A</a></li>                                        </ul>

  </div>
</div>

    <script src="/webclass/js/jquery/jquery-3.7.1.min.js"></script>
    <script src="/webclass/js/bootstrap.min.js"></script>
    <script src="/webclass/messages.php/assets/messages.js"></script>
    <script>
        document
            .getElementById('message-form')
            ?.addEventListener('submit', function (event) {
                const submitter = event.submitter;

                if (submitter?.name !== 'downloadmsg') {
                    return;
                }

                const checkedMessage = this.querySelector(
                    'input[name="id[]"]:checked'
                );

                if (checkedMessage === null) {
                    event.preventDefault();
                    alert('メッセージを選択してください');
                }
            });
    </script>
